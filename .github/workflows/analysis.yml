name: analysis

# Downloads the price data, re-runs the full analysis and commits the
# refreshed figures, tables and README results block back to the branch.
on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "run_analysis.py"
      - "requirements.txt"
      - ".github/workflows/analysis.yml"

permissions:
  contents: write

concurrency:
  group: analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run analysis
        run: |
          for attempt in 1 2 3; do
            python run_analysis.py && break
            echo "Attempt $attempt failed, retrying in 30s"; sleep 30
          done
          test -f results/REPORT.md
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures results README.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update figures and results from analysis run"
            git push
          fi
